<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; script-src 'self';"
    />
    <title>Now Playing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="loading">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-layer" id="ambientA"></div>
      <div class="ambient-layer" id="ambientB"></div>
      <div class="ambient-image"></div>
      <div class="wash wash-1"></div>
      <div class="wash wash-2"></div>
      <div class="wash wash-3"></div>
      <div class="ambient-veil"></div>
      <div class="ambient-grain"></div>
    </div>

    <div class="lock-head" aria-hidden="true">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-clock" id="lockClock"></div>
    </div>

    <!-- Theme 4's analogue clock. The 60 ticks and 12 numerals are generated
         once by app.js; only the hands and the date are declared here. -->
    <div class="dial" aria-hidden="true">
      <svg class="dial-face" viewBox="0 0 200 200">
        <g id="dialMarks"></g>
        <g class="hand hand-hour" id="handHour">
          <line x1="100" y1="108" x2="100" y2="56" />
        </g>
        <g class="hand hand-minute" id="handMinute">
          <line x1="100" y1="108" x2="100" y2="28" />
        </g>
        <g class="hand hand-second" id="handSecond">
          <line x1="100" y1="118" x2="100" y2="18" />
        </g>
        <circle class="dial-cap" cx="100" cy="100" r="4.6" />
        <circle class="dial-cap-inner" cx="100" cy="100" r="1.9" />
      </svg>
      <div class="dial-date" id="dialDate"></div>
    </div>

    <div class="chrome-top">
      <div class="clock" id="clock">--:--</div>
      <button class="close chrome" id="closeBtn" aria-label="Close" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path
            d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <main class="stage" id="stage">
      <div class="art">
        <div class="art-glow" id="artGlow"></div>
        <div class="art-frame">
          <img class="art-img is-active" id="artA" alt="" />
          <img class="art-img" id="artB" alt="" />
          <div class="art-placeholder" id="artPlaceholder">
            <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
              <path
                d="M9 18V5.2l10-2v12.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="6.6" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4" />
              <circle cx="16.6" cy="15.8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </div>
        </div>
      </div>

      <section class="meta" id="meta">
        <h1 class="title" id="title">Nothing playing</h1>
        <p class="artist" id="artist"></p>
        <p class="album" id="album"></p>

        <div class="scrub" id="scrub">
          <div class="scrub-track" id="scrubTrack">
            <div class="scrub-fill" id="scrubFill"></div>
            <div class="scrub-knob" id="scrubKnob"></div>
          </div>
          <div class="times">
            <span id="elapsed">0:00</span>
            <span id="remaining">0:00</span>
          </div>
        </div>

        <div class="controls chrome">
          <button class="ctrl" id="prevBtn" aria-label="Previous" title="Previous">
            <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
              <g fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M12.4 12 20 7v10z" />
                <path d="M4.6 12 12.2 7v10z" />
              </g>
            </svg>
          </button>

          <button class="ctrl ctrl-play" id="playBtn" aria-label="Play" title="Play / Pause (Space)">
            <svg class="glyph-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <path
                d="M7.8 5.4 19 12 7.8 18.6z"
                fill="currentColor"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="glyph-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <g fill="currentColor">
                <rect x="7.3" y="5.2" width="3.6" height="13.6" rx="1.7" />
                <rect x="13.1" y="5.2" width="3.6" height="13.6" rx="1.7" />
              </g>
            </svg>
          </button>

          <button class="ctrl" id="nextBtn" aria-label="Next" title="Next">
            <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
              <g fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <path d="M11.6 12 4 7v10z" />
                <path d="M19.4 12 11.8 7v10z" />
              </g>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div class="empty" id="empty">
      <p class="empty-title">Nothing playing</p>
      <p class="empty-hint">Start a track in Spotify</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
